<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e122c"/>
      <stop offset="0.45" stop-color="#14101f"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- rounded base -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- red rim -->
  <rect x="32" y="32" width="960" height="960" rx="196" fill="none" stroke="#ff2d3f" stroke-width="16"/>

  <!-- torii mark -->
  <g stroke="#ff3d4c" stroke-width="20" stroke-linecap="square" filter="url(#soft)" opacity="0.9">
    <line x1="372" y1="165" x2="652" y2="165"/>
    <line x1="412" y1="200" x2="612" y2="200"/>
    <line x1="444" y1="165" x2="432" y2="300"/>
    <line x1="580" y1="165" x2="592" y2="300"/>
    <line x1="512" y1="165" x2="512" y2="232"/>
  </g>
  <g stroke="#ff3d4c" stroke-width="20" stroke-linecap="square">
    <line x1="372" y1="165" x2="652" y2="165"/>
    <line x1="412" y1="200" x2="612" y2="200"/>
    <line x1="444" y1="165" x2="432" y2="300"/>
    <line x1="580" y1="165" x2="592" y2="300"/>
    <line x1="512" y1="165" x2="512" y2="232"/>
  </g>

  <!-- JJK letters -->
  <text x="512" y="700" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
        font-size="400" letter-spacing="10" fill="#f5f2eb" stroke="#14080c" stroke-width="5">JJK</text>

  <!-- cursed-energy slashes -->
  <g filter="url(#soft)" opacity="0.85">
    <line x1="215" y1="800" x2="810" y2="265" stroke="#ff2d46" stroke-width="52"/>
    <line x1="145" y1="800" x2="740" y2="265" stroke="#ff2d46" stroke-width="18"/>
    <line x1="285" y1="800" x2="880" y2="265" stroke="#b266ff" stroke-width="18"/>
  </g>
  <line x1="215" y1="800" x2="810" y2="265" stroke="#ff4655" stroke-width="34"/>
  <line x1="215" y1="800" x2="810" y2="265" stroke="#ffe4e8" stroke-width="12"/>
  <line x1="145" y1="800" x2="740" y2="265" stroke="#ff4655" stroke-width="10"/>
  <line x1="285" y1="800" x2="880" y2="265" stroke="#c482ff" stroke-width="10"/>

  <!-- caption pill -->
  <rect x="300" y="795" width="424" height="100" rx="26" fill="#05050a" fill-opacity="0.78"
        stroke="#ff4655" stroke-opacity="0.35" stroke-width="2"/>
  <text x="512" y="865" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="bold" font-size="60" letter-spacing="2" fill="#ffccd2">MOD EDITOR</text>
</svg>
